<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay 매출 Driver Tree</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

.header { background: linear-gradient(135deg, #1a1d27, #252830); padding: 20px 30px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; font-weight: 600; color: #f0f3f6; }
.header h1 span { color: #58a6ff; }

.year-tabs { display: flex; gap: 4px; background: #161b22; border-radius: 8px; padding: 4px; }
.year-tab { padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; color: #8b949e; border: none; background: transparent; transition: all 0.2s; }
.year-tab:hover { color: #c9d1d9; background: #21262d; }
.year-tab.active { background: #58a6ff; color: #fff; }

.summary-bar { display: flex; gap: 16px; padding: 16px 30px; background: #161b22; border-bottom: 1px solid #30363d; flex-wrap: wrap; }
.summary-card { background: #1c2028; border: 1px solid #30363d; border-radius: 10px; padding: 14px 20px; min-width: 180px; flex: 1; }
.summary-card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.summary-card .value { font-size: 22px; font-weight: 700; }
.summary-card.total .value { color: #f0f3f6; }
.summary-card.mentoring .value { color: #f78166; }
.summary-card.ai .value { color: #d2a8ff; }
.summary-card.material .value { color: #7ee787; }
.summary-card.subscription .value { color: #79c0ff; }

.tree-container { padding: 20px 30px; overflow-x: auto; }

.tree-node { margin: 4px 0; }
.node-row { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.node-row:hover { background: #1c2028; }

.expand-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 11px; color: #8b949e; flex-shrink: 0; transition: transform 0.2s; }
.expand-btn.expanded { transform: rotate(90deg); }
.expand-btn.leaf { visibility: hidden; }

.node-badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.3px; flex-shrink: 0; }
.badge-data { background: #1f3a5f; color: #58a6ff; }
.badge-assumption { background: #3d2e00; color: #f0b429; }
.badge-calc { background: #1a3a2a; color: #7ee787; }

.node-label { font-size: 14px; color: #c9d1d9; flex: 1; white-space: nowrap; }
.node-formula { font-size: 11px; color: #6e7681; margin-left: 4px; }

.node-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; min-width: 100px; padding: 3px 10px; border-radius: 6px; }
.val-data { color: #58a6ff; background: #0d1f3c; }
.val-assumption { color: #f0b429; background: #2a2000; cursor: text; border: 1px dashed #4d3800; }
.val-assumption:hover { border-color: #f0b429; }
.val-calc { color: #7ee787; background: #0d2818; }

.node-unit { font-size: 11px; color: #6e7681; min-width: 40px; }

.children { margin-left: 28px; border-left: 1px solid #21262d; padding-left: 8px; overflow: hidden; transition: max-height 0.3s ease; }
.children.collapsed { max-height: 0 !important; opacity: 0; pointer-events: none; }
.children.expanded { opacity: 1; pointer-events: auto; }

.segment-table { margin: 8px 0 8px 36px; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; font-size: 12px; max-height: 400px; overflow-y: auto; }
.segment-table table { width: 100%; border-collapse: collapse; }
.segment-table th { background: #161b22; color: #8b949e; padding: 6px 12px; text-align: left; font-weight: 500; position: sticky; top: 0; }
.segment-table td { padding: 5px 12px; border-top: 1px solid #21262d; }
.segment-table tr:hover td { background: #1c2028; }
.segment-table .seg-name { color: #c9d1d9; }
.segment-table .seg-val { text-align: right; font-variant-numeric: tabular-nums; }
.seg-input { background: transparent; border: none; color: #f0b429; font-size: 12px; text-align: right; width: 70px; font-variant-numeric: tabular-nums; padding: 2px 4px; border-radius: 3px; }
.seg-input:hover { background: #2a2000; }
.seg-input:focus { outline: none; background: #2a2000; border: 1px solid #f0b429; }

.connector { width: 16px; height: 1px; background: #30363d; flex-shrink: 0; }

.legend { display: flex; gap: 20px; padding: 10px 30px; border-top: 1px solid #30363d; background: #161b22; font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

.edit-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; z-index: 100; align-items: center; justify-content: center; }
.edit-overlay.active { display: flex; }

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
.updating { animation: pulse 0.3s; }
</style>
</head>

const SEGMENTS = RAW.segments;

let S1 = JSON.parse(JSON.stringify(RAW.S1));
let S2 = JSON.parse(JSON.stringify(RAW.S2));
let S3 = JSON.parse(JSON.stringify(RAW.S3));

function getSegVal(obj, seg, yr) {
  if (!obj[seg]) return 0;
  return obj[seg][yr] || 0;
}

function sumSegs(obj, yr) {
  let s = 0;
  for (const seg of SEGMENTS) s += getSegVal(obj, seg, yr);
  return s;
}

// ========== CALCULATION ENGINE ==========
function calcAll(yr) {
  const r = {};

  // Per-segment calculations
  r.tam = {}; r.enrolled = {}; r.active = {};
  r.txnCount = {}; r.mentoringGMV = {}; r.mentoringRev = {};
  r.aiUsers = {}; r.aiTxn = {}; r.aiRev = {};
  r.matBuyers = {}; r.matTxn = {}; r.matGMV = {}; r.matRev = {};
  r.subscribers = {}; r.subMonths = {}; r.subRev = {};

  for (const seg of SEGMENTS) {
    const applicants = getSegVal(S1.applicants, seg, yr);
    const dedup = getSegVal(S1.dedup, seg, yr);
    r.tam[seg] = dedup > 0 ? applicants / dedup : 0;

    const aw = getSegVal(S2.awareness, seg, yr);
    const su = getSegVal(S2.signup, seg, yr);
    r.enrolled[seg] = Math.floor(r.tam[seg] * aw * su);

    const act = getSegVal(S2.activation, seg, yr);
    r.active[seg] = Math.floor(r.enrolled[seg] * act);

    const freq = getSegVal(S2.txnFreq, seg, yr);
    r.txnCount[seg] = r.active[seg] * freq;

    const mp = getSegVal(S3.mentoringPrice, seg, yr);
    r.mentoringGMV[seg] = r.txnCount[seg] * mp / 1000;

    const mt = getSegVal(S3.mentoringTake, seg, yr);
    r.mentoringRev[seg] = r.mentoringGMV[seg] * mt;

    // AI
    const aiExp = getSegVal(S2.aiExposure, seg, yr);
    const aiConv = getSegVal(S2.aiConversion, seg, yr);
    r.aiUsers[seg] = Math.floor(r.enrolled[seg] * aiExp * aiConv);

    const aiFreq = getSegVal(S2.aiUsageFreq, seg, yr);
    r.aiTxn[seg] = r.aiUsers[seg] * aiFreq;

    const ap = getSegVal(S3.aiPrice, seg, yr);
    r.aiRev[seg] = r.aiTxn[seg] * ap / 1000;

    // Materials
    const matRate = getSegVal(S2.matPurchaseRate, seg, yr);
    r.matBuyers[seg] = Math.floor(r.enrolled[seg] * matRate);

    const matFreq = getSegVal(S2.matPurchaseFreq, seg, yr);
    r.matTxn[seg] = r.matBuyers[seg] * matFreq;

    const matP = getSegVal(S3.matPrice, seg, yr);
    r.matGMV[seg] = r.matTxn[seg] * matP / 1000;

    const matTk = S3.matTake[yr] || 0.3;
    r.matRev[seg] = r.matGMV[seg] * matTk;

    // Subscription
    const subConv = getSegVal(S2.subConversion, seg, yr);
    r.subscribers[seg] = Math.floor(r.enrolled[seg] * subConv);

    const subDur = getSegVal(S2.subDuration, seg, yr);
    r.subMonths[seg] = r.subscribers[seg] * subDur;

    const subP = getSegVal(S3.subPrice, seg, yr);
    r.subRev[seg] = r.subMonths[seg] * subP / 1000;
  }

  // Totals
  const sum = (obj) => { let s=0; for(const seg of SEGMENTS) s += (obj[seg]||0); return s; };
  r.totalMentoring = sum(r.mentoringRev);
  r.totalAI = sum(r.aiRev);
  r.totalMat = sum(r.matRev);
  r.totalSub = sum(r.subRev);
  r.totalRevenue = r.totalMentoring + r.totalAI + r.totalMat + r.totalSub;

  r.totalTAM = sum(r.tam);
  r.totalEnrolled = sum(r.enrolled);
  r.totalActive = sum(r.active);
  r.totalTxnCount = sum(r.txnCount);
  r.totalMentoringGMV = sum(r.mentoringGMV);
  r.totalAIUsers = sum(r.aiUsers);
  r.totalAITxn = sum(r.aiTxn);
  r.totalMatBuyers = sum(r.matBuyers);
  r.totalMatTxn = sum(r.matTxn);
  r.totalMatGMV = sum(r.matGMV);
  r.totalSubscribers = sum(r.subscribers);
  r.totalSubMonths = sum(r.subMonths);
  r.totalApplicants = sum(S1.applicants);

  return r;
}

let computed = {};

function fmt(v, decimals) {
  if (v === undefined || v === null || isNaN(v)) return '0';
  if (Math.abs(v) >= 1000) return v.toLocaleString('ko-KR', {maximumFractionDigits: decimals||0});
  if (Math.abs(v) >= 1) return v.toLocaleString('ko-KR', {maximumFractionDigits: decimals||1});
  return (v * 100).toFixed(1) + '%';
}

function fmtM(v) {
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(1) + 'B';
  if (Math.abs(v) >= 1) return v.toFixed(1) + 'M';
  return (v*1000).toFixed(0) + 'K';
}

function fmtWon(v) {
  return '₩' + fmtM(v);
}

function fmtPct(v) {
  return (v * 100).toFixed(1) + '%';
}

function fmtNum(v) {
  if (v === 0) return '0';
  if (Math.abs(v) >= 10) return Math.round(v).toLocaleString('ko-KR');
  return v.toFixed(1);
}

// ========== RENDERING ==========
const expandedNodes = new Set(['total']);
const expandedSegments = new Set();

function getDataSource(dataKey) {
  const [src, key] = dataKey.split('.');
  if (src === 'S1') return S1[key];
  if (src === 'S2') return S2[key];
  if (src === 'S3') return S3[key];
  return null;
}

function getWeightedAvg(dataKey, yr) {
  const obj = getDataSource(dataKey);
  if (!obj) return 0;
  let sum = 0, count = 0;
  for (const seg of SEGMENTS) {
    const v = (obj[seg] && obj[seg][yr]) || 0;
    sum += v; count++;
  }
  return count > 0 ? sum / count : 0;
}

function formatNodeValue(node, yr) {
  if (node.type === 'calc' && node.value !== undefined) {
    if (node.unit === '백만₩') return fmtWon(node.value);
    return fmtNum(node.value);
  }
  if (node.isSingle) {
    const v = node.value || 0;
    return node.unit === '%' ? fmtPct(v) : fmtNum(v);
  }
  if (node.dataKey) {
    const avg = getWeightedAvg(node.dataKey, yr);
    if (node.unit === '%') return fmtPct(avg);
    return fmtNum(avg);
  }
  return '';
}

function renderSegmentTable(node) {
  const yr = currentYear;
  const sd = node.segData;
  if (!sd) return '';
  
  let rows = '';
  for (const seg of SEGMENTS) {
    let val;
    if (sd.calc) {
      val = computed[sd.calc][seg] || 0;
      const display = node.unit === '백만₩' ? fmtWon(val) : node.unit === '%' ? fmtPct(val) : fmtNum(val);
      rows += '<tr><td class="seg-name">' + seg + '</td><td class="seg-val val-calc">' + display + '</td></tr>';
    } else if (sd.data) {
      const src = sd.source === 'S1' ? S1 : sd.source === 'S2' ? S2 : S3;
      val = (src[sd.data][seg] && src[sd.data][seg][yr]) || 0;
      if (node.segEditable) {
        const display = node.unit === '%' ? (val * 100).toFixed(1) : (typeof val === 'number' ? val : 0);
        rows += '<tr><td class="seg-name">' + seg + '</td><td class="seg-val">' +
          '<input class="seg-input" type="number" step="any" value="' + display + '" ' +
          'data-source="' + sd.source + '" data-key="' + sd.data + '" data-seg="' + seg + '" ' +
          'data-unit="' + node.unit + '" onchange="onSegChange(this)" />' +
          (node.unit === '%' ? '<span style="color:#6e7681;font-size:10px">%</span>' : '') +
          '</td></tr>';
      } else {
        const display = node.unit === '%' ? fmtPct(val) : fmtNum(val);
        rows += '<tr><td class="seg-name">' + seg + '</td><td class="seg-val val-data">' + display + '</td></tr>';
      }
    }
  }
  return '<div class="segment-table"><table><thead><tr><th>세그먼트</th><th style="text-align:right">값 (' + node.unit + ')</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderNode(node, depth) {
  const yr = currentYear;
  const hasChildren = node.children && node.children.length > 0 && !node.isRef;
  const isExpanded = expandedNodes.has(node.id);
  const showSegs = expandedSegments.has(node.id);

  const badgeClass = node.type === 'data' ? 'badge-data' : node.type === 'assumption' ? 'badge-assumption' : 'badge-calc';
  const badgeText = node.type === 'data' ? 'DATA' : node.type === 'assumption' ? 'INPUT' : 'CALC';
  const valClass = node.type === 'data' ? 'val-data' : node.type === 'assumption' ? 'val-assumption' : 'val-calc';

  const valueText = formatNodeValue(node, yr);
  const formulaText = node.formula ? '<span class="node-formula">' + node.formula + '</span>' : '';
  const colorStyle = node.color ? 'border-left: 3px solid ' + node.color + ';' : '';
  const refStyle = node.isRef ? 'opacity:0.6;font-style:italic;' : '';

  let html = '<div class="tree-node" id="node-' + node.id + '">';
  html += '<div class="node-row" style="' + colorStyle + refStyle + '" onclick="toggleNode(\x27' + node.id + '\x27)">';
  html += '<span class="expand-btn ' + (hasChildren ? (isExpanded ? 'expanded' : '') : 'leaf') + '">&#9654;</span>';
  html += '<span class="node-badge ' + badgeClass + '">' + badgeText + '</span>';
  html += '<span class="node-label">' + node.label + formulaText + '</span>';
  html += '<span class="node-value ' + valClass + '">' + valueText + '</span>';
  html += '<span class="node-unit">' + node.unit + '</span>';
  
  if (node.segData && !node.isRef) {
    html += '<span style="font-size:11px;color:#6e7681;cursor:pointer;padding:2px 6px;border-radius:4px;background:#161b22" onclick="event.stopPropagation();toggleSegments(\x27' + node.id + '\x27)">' + (showSegs ? '▲ 접기' : '▼ 세그먼트') + '</span>';
  }
  html += '</div>';

  if (showSegs && node.segData) {
    html += renderSegmentTable(node);
  }

  if (hasChildren) {
    html += '<div class="children ' + (isExpanded ? 'expanded' : 'collapsed') + '">';
    for (const child of node.children) {
      html += renderNode(child, depth + 1);
    }
    html += '</div>';
  }

  html += '</div>';
  return html;
}

function toggleNode(id) {
  if (expandedNodes.has(id)) {
    expandedNodes.delete(id);
  } else {
    expandedNodes.add(id);
  }
  render();
}

function toggleSegments(id) {
  if (expandedSegments.has(id)) {
    expandedSegments.delete(id);
  } else {
    expandedSegments.add(id);
  }
  render();
}

window.onSegChange = function(input) {
  const source = input.dataset.source;
  const key = input.dataset.key;
  const seg = input.dataset.seg;
  const unit = input.dataset.unit;
  let val = parseFloat(input.value);
  if (isNaN(val)) return;
  
  if (unit === '%') val = val / 100;

  const src = source === 'S1' ? S1 : source === 'S2' ? S2 : S3;
  if (!src[key]) src[key] = {};
  if (!src[key][seg]) src[key][seg] = {};
  src[key][seg][currentYear] = val;
  
  recalcAndRender();
};

function recalcAndRender() {
  computed = calcAll(currentYear);
  render();
}

function renderSummary() {
  const c = computed;
  const bar = document.getElementById('summaryBar');
  bar.innerHTML = 
    '<div class="summary-card total"><div class="label">Total Revenue</div><div class="value">' + fmtWon(c.totalRevenue) + '</div></div>' +
    '<div class="summary-card mentoring"><div class="label">멘토링</div><div class="value">' + fmtWon(c.totalMentoring) + '</div></div>' +
    '<div class="summary-card ai"><div class="label">AI</div><div class="value">' + fmtWon(c.totalAI) + '</div></div>' +
    '<div class="summary-card material"><div class="label">자료</div><div class="value">' + fmtWon(c.totalMat) + '</div></div>' +
    '<div class="summary-card subscription"><div class="label">구독</div><div class="value">' + fmtWon(c.totalSub) + '</div></div>';
}

function renderYearTabs() {
  const tabs = document.getElementById('yearTabs');
  tabs.innerHTML = '';
  for (const yr of YEARS) {
    const btn = document.createElement('button');
    btn.className = 'year-tab' + (yr === currentYear ? ' active' : '');
    btn.textContent = yr;
    btn.onclick = () => { currentYear = yr; recalcAndRender(); };
    tabs.appendChild(btn);
  }
}

function render() {
  const tree = buildTree();
  document.getElementById('treeContainer').innerHTML = renderNode(tree, 0);
  renderSummary();
  renderYearTabs();
}

// Initial render
computed = calcAll(currentYear);
render();
