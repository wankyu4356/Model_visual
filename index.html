<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Revenue Driver Tree</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--bg2:#f8f9fa;--bg3:#e9ecef;--border:#dee2e6;--text:#1a1a2e;--text2:#6c757d;--accent:#00695c;
--c-ment:#c62828;--c-ai:#6a1b9a;--c-mat:#00695c;--c-sub:#1565c0;--c-total:#263238}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}

.hdr{background:var(--bg);padding:10px 24px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:18px;flex-shrink:0;z-index:20}
.hdr h1{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.hdr h1 b{color:var(--accent)}
.ytabs{display:flex;gap:2px;background:var(--bg3);border-radius:6px;padding:2px}
.ytab{padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);border:none;background:transparent;transition:.15s}
.ytab:hover{color:var(--text);background:#dee2e6}
.ytab.on{background:var(--accent);color:#fff}
.sum{display:flex;gap:6px;margin-left:auto}
.sc{padding:5px 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg2)}
.sc .sl{font-size:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.sc .sv{font-size:15px;font-weight:800}

.leg{display:flex;gap:16px;padding:6px 24px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:10px;color:var(--text2);align-items:center;flex-shrink:0}
.leg .li{display:flex;align-items:center;gap:4px}
.leg .ld{width:10px;height:10px;border-radius:3px}
.leg .ht{margin-left:auto;opacity:.4;font-size:9px}

.main{flex:1;display:flex;overflow:hidden}
#cw{flex:1;overflow:hidden;position:relative;cursor:grab;background:var(--bg)}
#cw.drag{cursor:grabbing}
#cv{position:absolute;transform-origin:0 0}
#ln{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
#ln path{fill:none;stroke-width:1.5}
#nd{position:absolute;top:0;left:0}

/* Nodes = rounded rectangles */
.n{position:absolute;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;user-select:none;transition:box-shadow .2s;min-width:100px}
.n:hover{box-shadow:0 2px 12px rgba(0,0,0,.12);z-index:5}
.n .nn{font-size:11px;font-weight:600;line-height:1.3}
.n .nv{font-size:14px;font-weight:800;line-height:1.3}
.n .np{font-size:9px;font-weight:600;opacity:.7}
.n .ne{font-size:8px;opacity:.35;margin-left:4px}
.n.hk{padding-right:22px}
.n.hk::after{content:'\25B6';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:8px;opacity:.2}
.n.ex::after{display:none}

/* Node types */
.n-c{color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.n-c.cm{background:var(--c-ment)}
.n-c.ca{background:var(--c-ai)}
.n-c.cg{background:var(--c-mat)}
.n-c.cb{background:var(--c-sub)}
.n-c.ct{background:var(--c-total)}
.n-d{background:#eceff1;color:var(--text);border:1.5px solid #b0bec5}
.n-i{background:#fff;color:var(--text);border:2px dashed #bdbdbd}
.n-i:hover{border-color:#f57f17;background:#fff8e1}
.n-r{background:#f5f5f5;color:#9e9e9e;border:1px dashed #bdbdbd;opacity:.55;font-style:italic}

/* Operator circle */
.op{position:absolute;width:22px;height:22px;border-radius:50%;background:#37474f;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* Tooltip */
.tip{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:11px;color:var(--text);pointer-events:none;z-index:50;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,.12);opacity:0;transition:opacity .15s}
.tip.show{opacity:1}
.tip .tf{color:var(--text2);margin-bottom:4px;font-style:italic;font-size:10px}
.tip .tv{font-weight:800;font-size:14px;margin-bottom:6px;color:var(--accent)}
.tip table{width:100%;font-size:10px;border-collapse:collapse}
.tip td{padding:2px 6px;border-bottom:1px solid var(--bg3)}
.tip td:last-child{text-align:right;font-weight:700}

/* Side Panel */
.sp{width:0;overflow:hidden;background:var(--bg2);border-left:1px solid var(--border);transition:width .3s;flex-shrink:0;display:flex;flex-direction:column}
.sp.open{width:320px}
.spbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:15;background:var(--bg2);border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;padding:8px 5px;cursor:pointer;font-size:13px;color:var(--text2)}
.spbtn:hover{background:var(--bg3);color:var(--text)}
.sph{padding:14px 16px;border-bottom:2px solid var(--accent);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.sph button{background:none;border:none;font-size:16px;cursor:pointer;color:var(--text2)}
.spb{flex:1;overflow-y:auto;padding:16px}

/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center}
.mo.show{display:flex}
.md{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;max-width:640px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.15);color:var(--text)}
.md h3{font-size:14px;margin-bottom:4px;color:var(--accent)}
.md .msub{font-size:10px;color:var(--text2);margin-bottom:12px}
.md table{width:100%;border-collapse:collapse;font-size:11px}
.md th,.md td{padding:6px 10px;border-bottom:1px solid var(--bg3);text-align:left}
.md th{background:var(--bg2);font-weight:600;color:var(--text2);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.md input[type=number]{width:72px;padding:4px 6px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;background:#fff;color:var(--text);font-weight:600}
.md input[type=number]:focus{border-color:var(--accent);outline:none}
.md .cb{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)}

@keyframes flash{0%{box-shadow:0 0 0 0 rgba(0,105,92,.5)}50%{box-shadow:0 0 20px 4px rgba(0,105,92,.3)}100%{box-shadow:0 0 0 0 rgba(0,105,92,0)}}
.n.flash{animation:flash .6s ease-out}

</style>
</head>
<body>
<div class="hdr">
  <h1>Relay <b>매출 Driver Tree</b></h1>
  <div class="ytabs" id="YT"></div>
  <div class="sum" id="SM"></div>
</div>
<div class="leg">
  <div class="li"><div class="ld" style="background:#eceff1;border:1.5px solid #b0bec5"></div>실제 데이터</div>
  <div class="li"><div class="ld" style="background:#fff;border:2px dashed #bdbdbd"></div>가정치 (클릭 편집)</div>
  <div class="li"><div class="ld" style="background:#263238"></div>계산값</div>
  <span class="ht">드래그=이동 | 스크롤=줌 | 점선노드=편집 | 우클릭=세그먼트</span>
</div>
<div class="main">
  <div id="cw">
    <div id="cv">
      <svg id="ln"></svg>
      <div id="nd"></div>
    </div>
    <div class="tip" id="tip"></div>
    <button class="spbtn" onclick="toggleSP()">&#9776;</button>
  </div>
  <div class="sp" id="SP">
    <div class="sph"><span>Revenue Forecast</span><button onclick="toggleSP()">&times;</button></div>
    <div class="spb" id="SB"></div>
  </div>
</div>
<div class="mo" id="MO">
  <div class="md" id="MC"></div>
</div>

function getSegVal(obj, seg, yr) {
  if (!obj[seg]) return 0;
  return obj[seg][yr] || 0;
}

function sumSegs(obj, yr) {
  let s = 0;
  for (const seg of SEGMENTS) s += getSegVal(obj, seg, yr);
  return s;
}

// ========== CALCULATION ENGINE ==========
function calcAll(yr) {
  const r = {};

  // Per-segment calculations
  r.tam = {}; r.enrolled = {}; r.active = {};
  r.txnCount = {}; r.mentoringGMV = {}; r.mentoringRev = {};
  r.aiUsers = {}; r.aiTxn = {}; r.aiRev = {};
  r.matBuyers = {}; r.matTxn = {}; r.matGMV = {}; r.matRev = {};
  r.subscribers = {}; r.subMonths = {}; r.subRev = {};

  for (const seg of SEGMENTS) {
    const applicants = getSegVal(S1.applicants, seg, yr);
    const dedup = getSegVal(S1.dedup, seg, yr);
    r.tam[seg] = dedup > 0 ? applicants / dedup : 0;

    const aw = getSegVal(S2.awareness, seg, yr);
    const su = getSegVal(S2.signup, seg, yr);
    r.enrolled[seg] = Math.floor(r.tam[seg] * aw * su);

    const act = getSegVal(S2.activation, seg, yr);
    r.active[seg] = Math.floor(r.enrolled[seg] * act);

    const freq = getSegVal(S2.txnFreq, seg, yr);
    r.txnCount[seg] = r.active[seg] * freq;

    const mp = getSegVal(S3.mentoringPrice, seg, yr);

    const mt = getSegVal(S3.mentoringTake, seg, yr);
    r.mentoringRev[seg] = r.mentoringGMV[seg] * mt;

    const aiExp = getSegVal(S2.aiExposure, seg, yr);
    const aiConv = getSegVal(S2.aiConversion, seg, yr);

    const aiFreq = getSegVal(S2.aiUsageFreq, seg, yr);
    r.aiTxn[seg] = r.aiUsers[seg] * aiFreq;

    const ap = getSegVal(S3.aiPrice, seg, yr);
    r.aiRev[seg] = r.aiTxn[seg] * ap / 1000;

    // Materials
    const matRate = getSegVal(S2.matPurchaseRate, seg, yr);
    r.matBuyers[seg] = Math.floor(r.enrolled[seg] * matRate);

    const matFreq = getSegVal(S2.matPurchaseFreq, seg, yr);
    r.matTxn[seg] = r.matBuyers[seg] * matFreq;

    const matP = getSegVal(S3.matPrice, seg, yr);
    r.matGMV[seg] = r.matTxn[seg] * matP / 1000;

    const matTk = S3.matTake[yr] || 0.3;
    r.matRev[seg] = r.matGMV[seg] * matTk;

    // Subscription
    const subConv = getSegVal(S2.subConversion, seg, yr);
    r.subscribers[seg] = Math.floor(r.enrolled[seg] * subConv);

    const subDur = getSegVal(S2.subDuration, seg, yr);
    r.subMonths[seg] = r.subscribers[seg] * subDur;

    const subP = getSegVal(S3.subPrice, seg, yr);
    r.subRev[seg] = r.subMonths[seg] * subP / 1000;

  r.totalMatTxn = sum(r.matTxn);
  r.totalMatGMV = sum(r.matGMV);
  r.totalSubscribers = sum(r.subscribers);
  r.totalSubMonths = sum(r.subMonths);
  r.totalApplicants = sum(S1.applicants);

  return r;
}

let computed = {};

function fmt(v, decimals) {
  if (v === undefined || v === null || isNaN(v)) return '0';
  if (Math.abs(v) >= 1000) return v.toLocaleString('ko-KR', {maximumFractionDigits: decimals||0});
  if (Math.abs(v) >= 1) return v.toLocaleString('ko-KR', {maximumFractionDigits: decimals||1});
  return (v * 100).toFixed(1) + '%';
}

function fmtM(v) {
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(1) + 'B';
  if (Math.abs(v) >= 1) return v.toFixed(1) + 'M';
  return (v*1000).toFixed(0) + 'K';
}

function fmtWon(v) {
  return '₩' + fmtM(v);
}

function fmtPct(v) {
  return (v * 100).toFixed(1) + '%';
}

function fmtNum(v) {
  if (v === 0) return '0';
  if (Math.abs(v) >= 10) return Math.round(v).toLocaleString('ko-KR');
  return v.toFixed(1);
}

// ========== LAYOUT ==========
var CH=46,LG=220,VG=14;
var expanded=new Set(['total']);

function vk(n){return(!n.children||!n.children.length||n.isRef||!expanded.has(n.id))?[]:n.children;}

function layout(n,d,y0){
  n.x=d*LG+50;
  var k=vk(n);
  if(!k.length){n.y=y0;n._h=CH+VG;return n._h;}
  var y=y0,t=0;
  for(var i=0;i<k.length;i++){var h=layout(k[i],d+1,y);y+=h;t+=h;}
  n.y=(k[0].y+k[k.length-1].y)/2;
  n._h=t;return t;
}

// ========== FORMAT ==========
function fv(n){
  if(n.value!==undefined&&n.type==='calc')return n.unit.indexOf('\u20a9')>=0?fmtWon(n.value):fmtNum(n.value);
  if(n.isSingle)return n.unit==='%'?fmtPct(n.value||0):fmtNum(n.value||0);
  if(n.dataKey){
    var p=n.dataKey.split('.'),o=p[0]==='S1'?S1:p[0]==='S2'?S2:S3,k=p[1];
    if(!o[k])return'0';
    var s=0,c=0;
    for(var i=0;i<SEGMENTS.length;i++){var v=o[k][SEGMENTS[i]]&&o[k][SEGMENTS[i]][currentYear];if(v!==undefined){s+=v;c++;}}
    var a=c>0?s/c:0;
    return n.unit==='%'?fmtPct(a):fmtNum(a);
  }
  return'';
}

function nc(n){
  if(n.isRef)return'n n-r';
  if(n.type==='data')return'n n-d';
  if(n.type==='assumption')return'n n-i';
  var c='n n-c';if(n.colorClass)c+=' '+n.colorClass;return c;
}

// ========== RENDER ==========
function render(){
  var tree=buildTree();
  layout(tree,0,60);
  var all=[];
  (function f(n){all.push(n);var k=vk(n);for(var i=0;i<k.length;i++)f(k[i]);})(tree);

  var nd=document.getElementById('nd');
  var ph='';
  // Compute % weight for revenue nodes
  var totalRev=computed.totalRevenue||1;

  for(var i=0;i<all.length;i++){
    var n=all[i],v=fv(n),ex=expanded.has(n.id);
    var hk=n.children&&n.children.length&&!n.isRef;
    var ac=hk?(ex?' ex':' hk'):'';
    var isI=n.type==='assumption'&&!n.isRef;
    var ck=isI?'onclick="editPill(\x27'+n.id+'\x27,event)"':'onclick="tog(\x27'+n.id+'\x27)"';
    var rc=n.segData&&!n.isRef?'oncontextmenu="event.preventDefault();showModal(\x27'+n.id+'\x27)"':'';
    var pctHtml='';
    if(n.unit&&n.unit.indexOf('\u20a9')>=0&&n.value&&n.id!=='total'){
      var pct=(n.value/totalRev*100).toFixed(0);
      pctHtml='<span class="np">('+pct+'%)</span>';
    }
    ph+='<div class="'+nc(n)+ac+'" id="P'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px" '+ck+' '+rc;
    ph+=' onmouseenter="showTip(\x27'+n.id+'\x27,event)" onmouseleave="hideTip()">';
    ph+='<div style="display:flex;flex-direction:column"><span class="nn">'+n.label+'</span><span class="nv">'+v+' '+pctHtml+'</span></div>';
    if(isI)ph+='<span class="ne">\u270e</span>';
    ph+='</div>';
  }
  // Ops
  var oh='';
  for(var i=0;i<all.length;i++){
    var n=all[i],k=vk(n);
    if(k.length&&n.op)oh+='<div class="op" id="O'+n.id+'">'+n.op+'</div>';
  }
  nd.innerHTML=ph+oh;
  nd.offsetHeight; // force layout

  // Draw lines
  var svg=document.getElementById('ln'),paths='';
  for(var i=0;i<all.length;i++){
    var n=all[i],k=vk(n);
    if(!k.length)continue;
    var pe=document.getElementById('P'+n.id);
    var pw=pe?pe.offsetWidth:140;
    var x1=n.x+pw,y1=n.y+CH/2,sx=x1+4;
    var clr=n.color||'#90a4ae';
    if(n.op){
      var oe=document.getElementById('O'+n.id);
      if(oe){oe.style.left=(x1+8)+'px';oe.style.top=(y1-11)+'px';}
      sx=x1+34;
    }
    for(var j=0;j<k.length;j++){
      var c=k[j],x2=c.x,y2=c.y+CH/2;
      var mx=(sx+x2)/2;
      paths+='<path d="M'+sx+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2+'" stroke="'+clr+'" opacity=".35"/>';
    }
  }
  svg.innerHTML=paths;
  var mxx=0,mxy=0;
  for(var i=0;i<all.length;i++){if(all[i].x>mxx)mxx=all[i].x;if(all[i].y>mxy)mxy=all[i].y;}
  svg.setAttribute('width',mxx+400);svg.setAttribute('height',mxy+200);
  svg.style.width=(mxx+400)+'px';svg.style.height=(mxy+200)+'px';
  renderYT();renderSM();renderSP();
  window._tree=tree;window._all=all;
}

function renderYT(){
  var t=document.getElementById('YT');t.innerHTML='';
  for(var i=0;i<YEARS.length;i++){
    var yr=YEARS[i],b=document.createElement('button');
    b.className='ytab'+(yr===currentYear?' on':'');b.textContent=yr;
    b.setAttribute('data-yr',yr);
    b.onclick=function(){currentYear=parseInt(this.getAttribute('data-yr'));reCalc();};

// ========== EDIT / MODAL ==========
function editPill(id,ev){ev.stopPropagation();showModal(id);}

var curModal=null;
function showModal(nid){
  curModal=nid;
  var tree=buildTree();
  function find(n){if(n.id===nid)return n;for(var i=0;i<(n.children||[]).length;i++){var r=find(n.children[i]);if(r)return r;}return null;}
  var node=find(tree);if(!node||!node.segData)return;
  var yr=currentYear,sd=node.segData,rows='';
  for(var i=0;i<SEGMENTS.length;i++){
    var seg=SEGMENTS[i];
    if(sd.calc){
      var val=computed[sd.calc][seg]||0;
      var d=node.unit.indexOf('\u20a9')>=0?fmtWon(val):node.unit==='%'?fmtPct(val):fmtNum(val);
      rows+='<tr><td>'+seg+'</td><td style="text-align:right">'+d+'</td></tr>';
    } else if(sd.data){
      var src=sd.source==='S1'?S1:sd.source==='S2'?S2:S3;
      var val=(src[sd.data][seg]&&src[sd.data][seg][yr])||0;
      if(node.segEditable){
        var d=node.unit==='%'?(val*100).toFixed(1):(typeof val==='number'?val:0);
        rows+='<tr><td>'+seg+'</td><td style="text-align:right"><input type="number" step="any" value="'+d+'" data-source="'+sd.source+'" data-key="'+sd.data+'" data-seg="'+seg+'" data-unit="'+node.unit+'" onchange="segChg(this)"/>'+(node.unit==='%'?' %':'')+'</td></tr>';
      } else {
        var d=node.unit==='%'?fmtPct(val):fmtNum(val);
        rows+='<tr><td>'+seg+'</td><td style="text-align:right">'+d+'</td></tr>';
      }
    }
  }
  document.getElementById('MC').innerHTML=
    '<button class="cb" onclick="closeMo()">\u00d7</button>'+
    '<h3>'+node.label+'</h3>'+
    '<div class="msub">'+yr+'\ub144 \uc138\uadf8\uba3c\ud2b8\ubcc4 \u2014 \uac12 \uc218\uc815 \uc2dc \ud2b8\ub9ac \uc804\uccb4\uac00 \uc7ac\uacc4\uc0b0\ub429\ub2c8\ub2e4</div>'+
    '<table><thead><tr><th>\uc138\uadf8\uba3c\ud2b8</th><th style="text-align:right">\uac12 ('+node.unit+')</th></tr></thead><tbody>'+rows+'</tbody></table>';
  document.getElementById('MO').classList.add('show');
}
function closeMo(){document.getElementById('MO').classList.remove('show');curModal=null;}

window.segChg=function(inp){
  var src=inp.dataset.source==='S1'?S1:inp.dataset.source==='S2'?S2:S3;
  var val=parseFloat(inp.value);if(isNaN(val))return;
  if(inp.dataset.unit==='%')val=val/100;
  var key=inp.dataset.key,seg=inp.dataset.seg;
  if(!src[key])src[key]={};if(!src[key][seg])src[key][seg]={};
  src[key][seg][currentYear]=val;
  computed=calcAll(currentYear);
  render();
  if(curModal)showModal(curModal);
};

// ========== TOOLTIP ==========
function showTip(id,ev){
  var tree=window._tree;if(!tree)return;
  function find(n){if(n.id===id)return n;for(var i=0;i<(n.children||[]).length;i++){var r=find(n.children[i]);if(r)return r;}return null;}
  var node=find(tree);if(!node)return;
  var tip=document.getElementById('tip'),h='';
  if(node.formula)h+='<div class="tf">= '+node.formula+'</div>';
  h+='<div class="tv">'+fv(node)+' '+node.unit+'</div>';
  if(node.segData&&node.segData.calc){
    h+='<table>';
    var vals=[];
    for(var i=0;i<SEGMENTS.length;i++){var s=SEGMENTS[i],v=computed[node.segData.calc][s]||0;vals.push({s:s,v:v});}
    vals.sort(function(a,b){return b.v-a.v;});
    for(var i=0;i<Math.min(5,vals.length);i++){
      var d=node.unit.indexOf('\u20a9')>=0?fmtWon(vals[i].v):fmtNum(vals[i].v);
      h+='<tr><td>'+vals[i].s+'</td><td>'+d+'</td></tr>';}
    if(vals.length>5)h+='<tr><td colspan="2" style="color:var(--text2)">...+'+(vals.length-5)+' more</td></tr>';
    h+='</table>';
  }
  tip.innerHTML=h;
  tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY+14)+'px';
  tip.classList.add('show');
}
function hideTip(){document.getElementById('tip').classList.remove('show');}

    if(e.target.closest('.n')||e.target.closest('.op')||e.target.closest('.spbtn'))return;
    drag=true;sx=px;sy=py;mx=e.clientX;my=e.clientY;w.classList.add('drag');e.preventDefault();});
  window.addEventListener('mousemove',function(e){if(!drag)return;px=sx+(e.clientX-mx);py=sy+(e.clientY-my);cv.style.transform='translate('+px+'px,'+py+'px) scale('+zm+')';});
  window.addEventListener('mouseup',function(){drag=false;document.getElementById('cw').classList.remove('drag');});
  w.addEventListener('wheel',function(e){
    e.preventDefault();var d=e.deltaY>0?.92:1.08,nz=Math.max(.2,Math.min(3,zm*d));
    var r=w.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
    px=cx-(cx-px)*(nz/zm);py=cy-(cy-py)*(nz/zm);zm=nz;
    cv.style.transform='translate('+px+'px,'+py+'px) scale('+zm+')';},{passive:false});
  document.getElementById('MO').addEventListener('click',function(e){if(e.target===this)closeMo();});
}

// ========== INIT ==========
computed=calcAll(currentYear);
render();
initPZ();
toggleSP();
